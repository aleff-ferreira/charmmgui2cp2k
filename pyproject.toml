[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "charmmgui2cp2k"
dynamic = ["version"]
description = "Automated generation of CP2K QM/MM input from CHARMM-GUI / AMBER biomolecular setups"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aleff Ferreira" }]
keywords = [
    "QM/MM", "CP2K", "CHARMM-GUI", "AMBER", "multiscale simulation",
    "computational chemistry", "molecular dynamics", "input generation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
# The CLI *imports* with the standard library only (fast start, graceful
# degradation), but generating input requires ParmEd for correct topology
# preparation (LJ/charge editing via combining rules) — the manual fallback was
# removed because diagonal-only LJ patching is scientifically wrong.  ParmEd
# pulls NumPy; both are pip-installed automatically, so
# `pipx install charmmgui2cp2k` gives a working generator with no AmberTools.
dependencies = [
    "parmed>=4.0",
    "numpy",
]

[project.optional-dependencies]
# Full-screen Textual TUI (the plain CLI works without this).
tui = ["textual==8.2.5"]
# Optional YAML config support.
yaml = ["pyyaml"]
# Everything needed to run the test suite / develop.
dev = ["pytest", "pytest-asyncio", "textual==8.2.5", "pyyaml"]

[project.scripts]
charmmgui2cp2k = "charmmgui2cp2k:main"
charmmgui2cp2k-tui = "charmmgui2cp2k:main"

[project.urls]
Homepage = "https://github.com/aleff-ferreira/charmmgui2cp2k"
Repository = "https://github.com/aleff-ferreira/charmmgui2cp2k"
Issues = "https://github.com/aleff-ferreira/charmmgui2cp2k/issues"

[tool.setuptools]
py-modules = ["charmmgui2cp2k"]

[tool.setuptools.dynamic]
version = { attr = "charmmgui2cp2k.__version__" }

# Ship the one-command demo system so `charmmgui2cp2k --demo` works from a
# pip/pipx install, not only from a source checkout.
[tool.setuptools.data-files]
"share/charmmgui2cp2k/demo" = [
    "demo/ala_dipeptide.parm7",
    "demo/ala_dipeptide.rst7",
    "demo/ala_dipeptide.pdb",
    "demo/ala_dipeptide_qmmm.mdin",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast unit tests of the scientific core",
    "regression: golden-output regression tests",
    "tui: Textual TUI interaction tests",
    "integration: end-to-end / launcher tests",
    "requires_cp2k: needs a CP2K binary available on PATH",
]

[tool.coverage.run]
source = ["charmmgui2cp2k"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
# Floor that the CI-runnable suite (unit + regression + golden, no external
# CP2K/Amber/big-system deps) clears with headroom (~25% as of Phase 2).
# Ratchets up in later phases as coverage of the emitter and CLI/TUI grows;
# the long-term target is >= 85% on the scientific core.
fail_under = 20
